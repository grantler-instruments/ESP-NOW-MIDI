name: Build examples with PlatformIO

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  platformio-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build all PlatformIO examples
        run: bash scripts/platformio_build_examples.sh
