name: Build and Release ESP32 Sketches
on:
  push:
    branches: 
      - main
    tags:
      - '*'
  pull_request:
    branches: 
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board:
          - fqbn: "esp32:esp32:lolin_s2_mini"
            name: "lolin_s2_mini"
            build_properties: ""
          # USBMode=default = USB-OTG (TinyUSB); CDCOnBoot=cdc matches lolin_s2_mini
          - fqbn: "esp32:esp32:lolin_s3_mini:USBMode=default,CDCOnBoot=cdc"
            name: "lolin_s3_mini"
            build_properties: ""
          - fqbn: "esp32:esp32:esp32s2"
            name: "esp32s2"
            build_properties: ""
          - fqbn: "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc"
            name: "esp32s3"
            build_properties: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "${GITHUB_WORKSPACE}/bin" >> $GITHUB_PATH
      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Install library dependencies
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/ESP-NOW-MIDI
          arduino-cli lib install "Adafruit TinyUSB Library"
          arduino-cli lib install "Adafruit MPU6050"
          arduino-cli lib install "Adafruit_VL53L0X"
          arduino-cli lib install "Mozzi"
          arduino-cli lib install "AceButton"
      - name: Compile all examples for ${{ matrix.board.name }}
        run: |
          mkdir -p build
          for sketch in examples/*/; do
            if [ -d "$sketch" ]; then
              sketch_name=$(basename "$sketch")
              echo "Building $sketch_name for ${{ matrix.board.name }}"
              if [ -n "${{ matrix.board.build_properties }}" ]; then
                arduino-cli compile --fqbn ${{ matrix.board.fqbn }} --build-property "${{ matrix.board.build_properties }}" "$sketch" --output-dir build/"$sketch_name" || echo "Failed to build $sketch_name for ${{ matrix.board.name }}"
              else
                arduino-cli compile --fqbn ${{ matrix.board.fqbn }} "$sketch" --output-dir build/"$sketch_name" || echo "Failed to build $sketch_name for ${{ matrix.board.name }}"
              fi
            fi
          done
      - name: Organize binaries
        run: |
          mkdir -p binaries
          BOARD_NAME="${{ matrix.board.name }}"
          for sketch_dir in build/*/; do
            if [ -d "$sketch_dir" ]; then
              sketch_name=$(basename "$sketch_dir")
              for bin_file in "$sketch_dir"/*.bin; do
                if [ -f "$bin_file" ]; then
                  bin_basename=$(basename "$bin_file")
                  cp "$bin_file" "binaries/${BOARD_NAME}_${sketch_name}_${bin_basename}"
                fi
              done
            fi
          done
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-binaries-${{ matrix.board.name }}
          path: binaries/*.bin
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          pattern: esp32-binaries-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: all-binaries/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release_enomik:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          pattern: esp32-binaries-*
          merge-multiple: true
      - name: Publish firmware to enomik-app repo
        env:
          PAT: ${{ secrets.ENOMIK_APP_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          FOLDER=$(echo "${TAG}" | sed 's/\./-/g')
          export FOLDER
          git clone https://x-access-token:${PAT}@github.com/grantler-instruments/enomik-app.git enomik-app
          python3 << 'PY'
          import glob
          import json
          import os
          import shutil

          folder = os.environ["FOLDER"]
          root = "enomik-app/app/public/firmware"
          dest = os.path.join(root, folder)
          os.makedirs(dest, exist_ok=True)

          all_boards = [
              {
                  "id": "lolin_s2_mini",
                  "label": "LOLIN S2 Mini",
                  "requiresManualBootloader": True,
                  "resetMode": "no_reset",
                  "hardResetAfterFlash": False,
              },
              {
                  "id": "esp32s2",
                  "label": "ESP32-S2",
                  "requiresManualBootloader": True,
                  "resetMode": "no_reset",
                  "hardResetAfterFlash": False,
              },
              {
                  "id": "esp32s3",
                  "label": "ESP32-S3",
                  "requiresManualBootloader": False,
                  "resetMode": "usb_reset",
                  "hardResetAfterFlash": True,
              },
          ]
          all_roles = [
              {
                  "label": "Dongle",
                  "sketch": "dongle",
                  "description": "interface to MIDI host",
              },
              {
                  "label": "Client",
                  "sketch": "client",
                  "description": "board to connect sensors and actuators",
              },
              {
                  "label": "Print MAC",
                  "sketch": "print_mac",
                  "description": "prints the MAC address to serial (use this if you are not using a dongle with display)",
              },
          ]

          available = set()
          for board in all_boards:
              for role in all_roles:
                  pattern = f"all-binaries/{board['id']}_{role['sketch']}_*.ino.bin"
                  matches = sorted(glob.glob(pattern))
                  if not matches:
                      print(f"skip missing: {board['id']} / {role['sketch']}")
                      continue
                  for src in matches:
                      shutil.copy2(src, dest)
                      print(f"copied: {os.path.basename(src)}")
                  available.add((board["id"], role["sketch"]))

          if not available:
              raise SystemExit("no firmware binaries found for enomik deploy")

          # Keep a complete board×role matrix so the app never offers a
          # board/role combo without a matching binary.
          boards_keep = {board_id for board_id, _ in available}
          roles_keep = {sketch for _, sketch in available}
          changed = True
          while changed:
              changed = False
              for board_id in list(boards_keep):
                  if not all((board_id, sketch) in available for sketch in roles_keep):
                      boards_keep.remove(board_id)
                      changed = True
              for sketch in list(roles_keep):
                  if not all((board_id, sketch) in available for board_id in boards_keep):
                      roles_keep.remove(sketch)
                      changed = True

          if not boards_keep or not roles_keep:
              raise SystemExit(
                  "no complete board/role matrix for enomik deploy; "
                  f"available pairs={sorted(available)}"
              )

          boards = [board for board in all_boards if board["id"] in boards_keep]
          roles = [role for role in all_roles if role["sketch"] in roles_keep]
          manifest = {"boards": boards, "roles": roles}
          with open(os.path.join(dest, "manifest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent="\t")
              f.write("\n")
          print(f"manifest boards={[b['id'] for b in boards]} roles={[r['sketch'] for r in roles]}")

          dirs = [
              d
              for d in os.listdir(root)
              if os.path.isdir(os.path.join(root, d)) and not d.startswith(".")
          ]

          def sort_key(name: str):
              try:
                  return tuple(int(p) for p in name.split("-"))
              except ValueError:
                  return (-1, name)

          dirs.sort(key=sort_key, reverse=True)
          with open(os.path.join(root, "versions.json"), "w", encoding="utf-8") as f:
              json.dump({"versions": dirs}, f, indent=2)
              f.write("\n")
          PY
          cd enomik-app
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "app/public/firmware/${FOLDER}" app/public/firmware/versions.json
          git commit -m "firmware: add binaries for ${FOLDER}; refresh versions.json"
          git push