name: Publish documentation

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "Doxyfile"
      - "include/version.h"
      - "*.h"
      - "esp_now_midi.py"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Tag pushes cannot deploy to the github-pages environment when only branches
# (e.g. main) are allowed by environment protection rules. On tags we re-run
# this workflow from main; deploy-versions.sh picks up the new tag there.

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  retrigger:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy docs from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            --ref main

  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen unzip
          python -m pip install -r docs/requirements.txt

      - name: Build versioned site
        run: bash docs/deploy-versions.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref_type != 'tag'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
