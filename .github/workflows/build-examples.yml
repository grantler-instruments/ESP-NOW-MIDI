name: Build and Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure native tests
        run: cmake -S test/native -B test/native/build

      - name: Build native tests
        run: cmake --build test/native/build -j

      - name: Run native tests
        run: ctest --test-dir test/native/build --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SysEx constant sync
        run: python3 scripts/check_sysex_constants.py

      - name: Run protocol constant tests
        run: python3 -m unittest discover -s test/protocol -v

  circuitpython-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mpy-cross
        run: |
          curl -fsSL -o mpy-cross \
            https://adafruit-circuit-python.s3.amazonaws.com/bin/mpy-cross/linux-amd64/mpy-cross-linux-amd64-9.2.8.static
          chmod +x mpy-cross
          sudo mv mpy-cross /usr/local/bin/mpy-cross

      - name: Compile CircuitPython library
        run: mpy-cross esp_now_midi.py -o esp_now_midi.mpy

      - name: Run CircuitPython unit tests
        run: python3 -m unittest discover -s test/circuitpython -v

  idf-build:
    name: IDF ${{ matrix.idf_ver }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf_ver: ["v5.3.3", "v5.4.1"]
        target: [esp32, esp32s3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test/idf
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_ver }}
          target: ${{ matrix.target }}
          path: test/idf
          # Default is "idf.py build"; do not pass bare "build" (runs as a shell command).

  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        board:
          - fqbn: "esp32:esp32:lolin_s2_mini"
            name: "lolin_s2_mini"
          - fqbn: "esp32:esp32:esp32s2"
            name: "esp32s2"
          # USBMode=default = USB-OTG (TinyUSB); CDCOnBoot=cdc matches lolin_s2_mini
          - fqbn: "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc"
            name: "esp32s3"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "${GITHUB_WORKSPACE}/bin" >> $GITHUB_PATH
          
      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          
      - name: Install library dependencies
        run: |
          # Create Arduino libraries directory
          mkdir -p $HOME/Arduino/libraries
          
          # Symlink this repository as a library so examples can find it
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/ESP-NOW-MIDI
          
          # Install any external dependencies (add more as needed)
          arduino-cli lib install "Adafruit TinyUSB Library"
          arduino-cli lib install "MIDI Library"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit_VL53L0X"
          arduino-cli lib install "Mozzi"
          arduino-cli lib install "AceButton"
          arduino-cli lib install "ESP32Servo"
          arduino-cli lib install "MPU9250_WE"
          arduino-cli lib install "Adafruit NeoPixel"
          git clone https://github.com/pschatzmann/arduino-audio-tools.git $HOME/Arduino/libraries/AudioTools
          git clone https://github.com/algomusic/M16.git $HOME/Arduino/libraries/M16
          
      - name: Compile all examples for ${{ matrix.board.name }}
        run: |
          mkdir -p build
          failed=0
          for sketch in examples/*/; do
            if [ -d "$sketch" ]; then
              sketch_name=$(basename "$sketch")
              echo "Building $sketch_name for ${{ matrix.board.name }}"
              if ! arduino-cli compile --fqbn ${{ matrix.board.fqbn }} "$sketch" --output-dir build/"$sketch_name"; then
                echo "Failed to build $sketch_name for ${{ matrix.board.name }}"
                failed=1
              fi
            fi
          done
          exit $failed
          
      - name: Organize binaries for web embedding
        run: |
          mkdir -p binaries
          BOARD_NAME="${{ matrix.board.name }}"
          for sketch_dir in build/*/; do
            if [ -d "$sketch_dir" ]; then
              sketch_name=$(basename "$sketch_dir")
              for bin_file in "$sketch_dir"/*.bin; do
                if [ -f "$bin_file" ]; then
                  bin_basename=$(basename "$bin_file")
                  # Copy with board name prefix: boardname_sketchname_filename.bin
                  cp "$bin_file" "binaries/${BOARD_NAME}_${sketch_name}_${bin_basename}"
                fi
              done
            fi
          done
          
      - name: Upload individual binary files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-binaries-${{ matrix.board.name }}
          path: binaries/*.bin