name: Build and Test
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure native tests
        run: cmake -S test/native -B test/native/build

      - name: Build native tests
        run: cmake --build test/native/build -j

      - name: Run native tests
        run: ctest --test-dir test/native/build --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SysEx constant sync
        run: python3 scripts/check_sysex_constants.py

      - name: Run protocol constant tests
        run: python3 -m unittest discover -s test/protocol -v

  circuitpython-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mpy-cross
        run: |
          curl -fsSL -o mpy-cross \
            https://adafruit-circuit-python.s3.amazonaws.com/bin/mpy-cross/linux-amd64/mpy-cross-linux-amd64-9.2.8.static
          chmod +x mpy-cross
          sudo mv mpy-cross /usr/local/bin/mpy-cross

      - name: Compile CircuitPython library
        run: mpy-cross esp_now_midi.py -o esp_now_midi.mpy

      - name: Run CircuitPython unit tests
        run: python3 -m unittest discover -s test/circuitpython -v

  idf-build:
    name: IDF ${{ matrix.idf_ver }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf_ver: ["v6.0.1"] # matches the local IDF install used to verify this
        target: [esp32, esp32s3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test/idf
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_ver }}
          target: ${{ matrix.target }}
          path: test/idf
          # Default is "idf.py build"; do not pass bare "build" (runs as a shell command).

  examples_idf:
    name: examples_idf / ${{ matrix.example }} / ${{ matrix.idf_ver }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf_ver: ["v6.0.1"] # matches the local IDF install used to verify this
        target: [esp32, esp32s3]
        # Add new examples_idf/* directories here (same as the `board` list
        # below for Arduino examples - no dynamic discovery, kept simple).
        example: [dongle, client, client_test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build examples_idf/${{ matrix.example }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_ver }}
          target: ${{ matrix.target }}
          path: examples_idf/${{ matrix.example }}
          # Regenerate sdkconfig for the matrix target (do not commit sdkconfig —
          # it pins a single chip and breaks multi-target CI).
          command: idf.py set-target "$IDF_TARGET" && idf.py build

  examples:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        board:
          - fqbn: "esp32:esp32:lolin_s2_mini"
            name: "lolin_s2_mini"
          - fqbn: "esp32:esp32:esp32s2"
            name: "esp32s2"
          # USBMode=default = USB-OTG (TinyUSB); CDCOnBoot=cdc matches lolin_s2_mini
          - fqbn: "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc"
            name: "esp32s3"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "${GITHUB_WORKSPACE}/bin" >> $GITHUB_PATH
          
      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          
      - name: Install library dependencies
        run: |
          # Create Arduino libraries directory
          mkdir -p $HOME/Arduino/libraries
          
          # Symlink this repository as a library so examples can find it
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/ESP-NOW-MIDI
          
          # Install any external dependencies (add more as needed)
          arduino-cli lib install "Adafruit TinyUSB Library"
          arduino-cli lib install "MIDI Library"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit_VL53L0X"
          arduino-cli lib install "Mozzi"
          arduino-cli lib install "AceButton"
          arduino-cli lib install "ESP32Servo"
          arduino-cli lib install "MPU9250_WE"
          arduino-cli lib install "Adafruit NeoPixel"
          git clone https://github.com/pschatzmann/arduino-audio-tools.git $HOME/Arduino/libraries/AudioTools
          git clone https://github.com/algomusic/M16.git $HOME/Arduino/libraries/M16
          
      - name: Compile all examples for ${{ matrix.board.name }}
        run: |
          mkdir -p build
          failed=0
          for sketch in examples/*/; do
            if [ -d "$sketch" ]; then
              sketch_name=$(basename "$sketch")
              echo "Building $sketch_name for ${{ matrix.board.name }}"
              if ! arduino-cli compile --fqbn ${{ matrix.board.fqbn }} "$sketch" --output-dir build/"$sketch_name"; then
                echo "Failed to build $sketch_name for ${{ matrix.board.name }}"
                failed=1
              fi
            fi
          done
          exit $failed
          
      - name: Organize binaries for web embedding
        run: |
          mkdir -p binaries
          BOARD_NAME="${{ matrix.board.name }}"
          for sketch_dir in build/*/; do
            if [ -d "$sketch_dir" ]; then
              sketch_name=$(basename "$sketch_dir")
              for bin_file in "$sketch_dir"/*.bin; do
                if [ -f "$bin_file" ]; then
                  bin_basename=$(basename "$bin_file")
                  # Copy with board name prefix: boardname_sketchname_filename.bin
                  cp "$bin_file" "binaries/${BOARD_NAME}_${sketch_name}_${bin_basename}"
                fi
              done
            fi
          done
          
      - name: Upload individual binary files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-binaries-${{ matrix.board.name }}
          path: binaries/*.bin

  release:
    needs: [unit-test, circuitpython-test, idf-build, examples_idf, examples]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          pattern: esp32-binaries-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: all-binaries/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release_enomik:
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          pattern: esp32-binaries-*
          merge-multiple: true
      - name: Publish firmware to enomik-app repo
        env:
          PAT: ${{ secrets.ENOMIK_APP_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          FOLDER=$(echo "${TAG}" | sed 's/\./-/g')
          git clone https://x-access-token:${PAT}@github.com/grantler-instruments/enomik-app.git enomik-app
          mkdir -p "enomik-app/app/public/firmware/${FOLDER}"
          for board in lolin_s2_mini esp32s2 esp32s3; do
            for sketch in client dongle print_mac; do
              cp all-binaries/${board}_${sketch}_*.ino.bin "enomik-app/app/public/firmware/${FOLDER}/"
            done
          done
          python3 << 'PY'
          import json, os

          root = "enomik-app/app/public/firmware"
          dirs = [
              d
              for d in os.listdir(root)
              if os.path.isdir(os.path.join(root, d)) and not d.startswith(".")
          ]

          def sort_key(name: str):
              try:
                  return tuple(int(p) for p in name.split("-"))
              except ValueError:
                  return (-1, name)

          dirs.sort(key=sort_key, reverse=True)
          path = os.path.join(root, "versions.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump({"versions": dirs}, f, indent=2)
              f.write("\n")
          PY
          cd enomik-app
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "app/public/firmware/${FOLDER}" app/public/firmware/versions.json
          git commit -m "firmware: add binaries for ${FOLDER}; refresh versions.json"
          git push
