; Shared PlatformIO settings for ESP-NOW-MIDI examples.
; Include from each example: extra_configs = ../../platformio/common.ini
;
; Uses the pioarduino espressif32 platform for Arduino-ESP32 3.3.x support.
; Official platformio/espressif32 + a git framework override breaks because
; Arduino core 3.x no longer ships tools/platformio-build.py.

[env:base_s2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = lolin_s2_mini
framework = arduino
; Header-only library: expose repo root via -I. Do not use lib_extra_dirs on the
; repo root — PlatformIO then treats examples/ as a library and breaks LDF
; include paths (e.g. Adafruit BusIO headers missing while compiling MPU6050).
build_flags =
    -I ${PROJECT_DIR}/../..
    -I ${PROJECT_PACKAGES_DIR}/framework-arduinoespressif32/libraries/Network/src
lib_ldf_mode = chain+
lib_deps =
    WiFi
    Networking
    Preferences
    EEPROM
    adafruit/Adafruit TinyUSB Library
    https://github.com/FortySevenEffects/arduino_midi_library.git

[env:base_s3]
extends = env:base_s2
board = lolin_s3_mini
board_build.usb_mode = tinyusb
