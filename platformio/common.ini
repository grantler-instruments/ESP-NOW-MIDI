; Shared PlatformIO settings for ESP-NOW-MIDI examples.
; Include from each example: extra_configs = ../../platformio/common.ini
;
; Requires Arduino-ESP32 3.3.0+ (see README). CI builds on Linux; on macOS
; Apple Silicon, PlatformIO may fail to install toolchain-riscv32-esp until
; a compatible package is published — use CI, Docker, or Arduino CLI locally.

[env:base_s2]
platform = espressif32 @ 6.10.0
board = lolin_s2_mini
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.3.0
lib_extra_dirs = ${PROJECT_DIR}/../..
build_flags = -I ${PROJECT_DIR}/../..
lib_ldf_mode = deep+
lib_deps =
    WiFi
    Preferences
    EEPROM
    adafruit/Adafruit TinyUSB Library
    https://github.com/FortySevenEffects/arduino_midi_library.git

[env:base_s3]
extends = env:base_s2
board = lolin_s3_mini
board_build.usb_mode = tinyusb
