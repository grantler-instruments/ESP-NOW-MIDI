[platformio]
extra_configs = ../../../platformio/common.ini
default_envs = lolin_s2_mini
src_dir = .
workspace_dir = ../../../.pio/workspaces/${PROJECT_HASH}

[env:lolin_s2_mini]
extends = env:base_s2
; Nested example: repo root is three levels up (common.ini assumes two).
build_flags =
    ${env:base_s2.build_flags}
    -I ${PROJECT_DIR}/../../..
lib_deps =
    ${env:base_s2.lib_deps}
    https://github.com/BelaPlatform/Trill-Arduino.git
